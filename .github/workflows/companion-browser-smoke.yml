name: Team Fetch single-interface browser smoke

on:
  push:
    branches:
      - feat/ioi-contract-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          (npm run dev -- --host 127.0.0.1 > /tmp/fetch-vite.log 2>&1 &)
          node --input-type=module -e '
            const until = Date.now() + 60000;
            while (Date.now() < until) {
              try {
                const response = await fetch("http://127.0.0.1:5173/companion");
                if (response.ok) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            console.error(await (await import("node:fs/promises")).readFile("/tmp/fetch-vite.log", "utf8"));
            process.exit(1);
          '
      - name: Render Team Fetch and collect browser failures
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 950 } });
          const errors = [];
          await page.addInitScript(() => {
            try { localStorage.setItem("fetch_onboarding_v2_complete", "1"); } catch {}
          });
          // Vite does not execute Vercel serverless functions. Stub this read-only
          // task-ledger request so the smoke test measures client rendering only.
          await page.route("**/api/fetch/tasks**", (route) => route.fulfill({
            status: 200,
            contentType: "application/json",
            body: JSON.stringify({ success: true, tasks: [] }),
          }));
          page.on("pageerror", (error) => errors.push("pageerror: " + error.message));
          page.on("console", (message) => {
            if (message.type() === "error") errors.push("console: " + message.text());
          });
          const response = await page.goto("http://127.0.0.1:5173/companion", { waitUntil: "networkidle" });
          await page.waitForTimeout(800);
          await page.screenshot({ path: "/tmp/fetch-companion.png", fullPage: true });
          const bodyText = await page.locator("body").innerText();
          const rootText = await page.locator("#root").innerText();
          console.log(JSON.stringify({
            httpStatus: response?.status(),
            title: await page.title(),
            bodyText: bodyText.slice(0, 1600),
            rootText: rootText.slice(0, 1600),
            browserErrors: errors,
          }, null, 2));
          if (!response?.ok()) throw new Error("Team Fetch route returned HTTP " + response?.status());
          if (!rootText.includes("Tell me what you need done")) throw new Error("Original Fetch chat did not render");
          if (!rootText.includes("Team Fetch")) throw new Error("Team Fetch panel/navigation did not render");
          for (const specialist of ["Scout", "Rover", "Patch", "Scribe", "Trek"]) {
            if (!rootText.includes(specialist)) throw new Error("Missing Team Fetch specialist: " + specialist);
          }
          if (!rootText.includes("Daily minutes")) throw new Error("Daily minutes tab did not render");
          if (await page.locator("#fcl-request").count() !== 0) throw new Error("Duplicate request composer remains inside Team Fetch panel");
          const avatarCount = await page.locator(".fcl-agent-avatar").count();
          if (avatarCount !== 6) throw new Error("Expected six Team Fetch character portraits, found " + avatarCount);
          for (const selector of [".fcl-identity .fcl-fetch-character", ".fcl-launcher .fcl-fetch-character"]) {
            const character = page.locator(selector);
            if (await character.count() !== 1) throw new Error("Fetch character portrait is missing from " + selector);
            const usesSprite = await character.evaluate((element) => getComputedStyle(element).backgroundImage.includes("data:image/webp;base64,"));
            if (!usesSprite) throw new Error("Fetch header/launcher does not use the real Fetch character sprite: " + selector);
          }
          const spriteInfo = await page.locator(".fcl-agent-avatar").first().evaluate(async (element) => {
            const cssImage = getComputedStyle(element).backgroundImage;
            const match = cssImage.match(/^url\(["']?(.*?)["']?\)$/);
            if (!match) throw new Error("Character sprite background image is missing");
            const image = new Image();
            image.src = match[1];
            await image.decode();
            return { width: image.naturalWidth, height: image.naturalHeight };
          });
          if (spriteInfo.width !== 384 || spriteInfo.height !== 256) throw new Error("Unexpected Team Fetch sprite dimensions: " + JSON.stringify(spriteInfo));
          const avatarPositions = await page.locator(".fcl-agent-avatar").evaluateAll((elements) => elements.map((element) => getComputedStyle(element).backgroundPosition));
          if (new Set(avatarPositions).size !== 6) throw new Error("Team Fetch characters do not have six distinct sprite positions");

          // Profile drawer: form controls and save action are present.
          await page.getByRole("button", { name: "Open your profile" }).click();
          if (!await page.getByRole("heading", { name: "Your profile" }).isVisible()) throw new Error("Profile drawer did not open");
          for (const placeholder of ["Your name", "+91…", "you@example.com", "House, street, locality", "City"]) {
            if (await page.getByPlaceholder(placeholder).count() !== 1) throw new Error("Missing profile field: " + placeholder);
          }
          if (!await page.getByRole("button", { name: "Save profile" }).isVisible()) throw new Error("Profile save button missing");
          await page.locator(".fetch-profile-header .fetch-drawer-close").click();

          // Desktop navigation remains visible and the Recent chats panel is usable.
          if (!await page.locator(".fetch-workspace-sidebar").isVisible()) throw new Error("Desktop persistent sidebar did not render");
          if (!await page.locator(".fetch-sidebar-links").getByRole("button", { name: /Recent chats/ }).isVisible()) throw new Error("Recent chats navigation missing");
          if (!await page.locator(".fetch-sidebar-links").getByRole("button", { name: "Fetch Partners" }).isVisible()) throw new Error("Fetch Partners navigation missing");
          await page.locator(".fetch-sidebar-links").getByRole("button", { name: /Recent chats/ }).click();
          if (!await page.locator(".fetch-recent-list").isVisible()) throw new Error("Recent chats view did not render");
          await page.locator(".fetch-navigation-drawer .fetch-drawer-close").click();

          // Test partner page through existing in-app routing.
          await page.locator(".fetch-sidebar-links").getByRole("button", { name: "Fetch Partners" }).click();
          await page.waitForFunction(() => window.location.pathname === "/partners");
          const partnerText = await page.locator("#root").innerText();
          for (const category of ["Local commerce", "Home services", "Mobility", "Assisted services"]) {
            if (!partnerText.includes(category)) throw new Error("Missing partner category: " + category);
          }

          // Mobile uses the same navigation in a compact drawer.
          await page.goto("http://127.0.0.1:5173/", { waitUntil: "networkidle" });
          await page.setViewportSize({ width: 390, height: 850 });
          if (await page.locator(".fetch-workspace-sidebar").isVisible()) throw new Error("Persistent desktop sidebar should be hidden on mobile");
          await page.getByRole("button", { name: "Open Fetch menu" }).click();
          if (!await page.getByRole("button", { name: "Fetch Partners" }).isVisible()) throw new Error("Mobile navigation drawer did not render");
                    if (errors.length) throw new Error("Browser console/runtime errors: " + errors.join(" | "));
          await browser.close();
          NODE
