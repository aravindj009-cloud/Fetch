name: Fetch server-first RLS preview

on:
  pull_request:
    paths:
      - "docs/security/**"
      - ".github/workflows/security-rls-preview.yml"
  workflow_dispatch:

jobs:
  rls-preview:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fetch_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fetch_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply isolated RLS fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fetch_security_test -v ON_ERROR_STOP=1 -f docs/security/test-fixture.sql
      - name: Apply proposed hardening migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fetch_security_test -v ON_ERROR_STOP=1 -f docs/security/preview-migration-draft.sql
      - name: Run RLS policy assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fetch_security_test -v ON_ERROR_STOP=1 -f docs/security/preview-rls-assertions.sql
      - name: Run role and admin behaviour tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fetch_security_test -v ON_ERROR_STOP=1 -f docs/security/preview-rls-behaviour-tests.sql
