<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch — Operations</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f9;
      color: #111827;
    }

    header {
      height: 72px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo span {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      margin-left: 8px;
    }

    .online {
      background: #ecfdf5;
      color: #059669;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    main {
      max-width: 1150px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 28px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px;
    }

    .stat-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
    }

    .orders {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .order {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .order-id {
      font-weight: 800;
      font-size: 17px;
    }

    .status {
      background: #fff7ed;
      color: #ea580c;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .label {
      font-size: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .store {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    .budget {
      margin-top: 15px;
      font-weight: 700;
    }

    .status-text {
      color: #4b5563;
      margin-top: 5px;
    }

    .empty {
      background: white;
      border: 1px dashed #d1d5db;
      border-radius: 14px;
      padding: 50px;
      text-align: center;
      color: #6b7280;
    }

    .loading {
      padding: 50px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .refresh {
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .refresh:hover {
      background: #f9fafb;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 20px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .order-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    FETCH <span>Operations</span>
  </div>

  <div class="online">
    ● SYSTEM ONLINE
  </div>
</header>

<main>

  <h1>Orders</h1>

  <div class="subtitle">
    Manage customer requests and human shoppers.
  </div>

  <div id="error"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">Active Orders</div>
      <div class="stat-number" id="activeOrders">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Available Shoppers</div>
      <div class="stat-number" id="availableShoppers">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Today's Orders</div>
      <div class="stat-number" id="todayOrders">—</div>
    </div>

  </div>

  <div class="section-header">
    <h2>Live Orders</h2>

    <button class="refresh" onclick="loadData()">
      ↻ Refresh
    </button>
  </div>

  <div id="orders" class="loading">
    Loading orders...
  </div>

</main>

<script>

  /*
    ==========================================
    FETCH + SUPABASE CONNECTION
    ==========================================
  */

  const SUPABASE_URL =
    "https://skfxzagxlxputwpxwbe.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zQueXzNbRTTsdV5xjn398Q_nSB4njep";


  /*
    CREATE SUPABASE CLIENT
  */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /*
    ==========================================
    LOAD DATA
    ==========================================
  */

  async function loadData() {

    const ordersBox =
      document.getElementById("orders");

    const errorBox =
      document.getElementById("error");

    errorBox.innerHTML = "";

    ordersBox.innerHTML =
      '<div class="loading">Loading orders...</div>';


    try {

      /*
        --------------------------------------
        GET ORDERS
        --------------------------------------
      */

      const {
        data: orders,
        error: ordersError
      } = await supabaseClient
        .from("orders")
        .select(
          "id, store_name, items, budget, status, created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (ordersError) {
        throw ordersError;
      }


      /*
        --------------------------------------
        GET SHOPPERS
        --------------------------------------
      */

      const {
        data: shoppers,
        error: shoppersError
      } = await supabaseClient
        .from("shoppers")
        .select(
          "id, available"
        );


      if (shoppersError) {
        throw shoppersError;
      }


      /*
        --------------------------------------
        ACTIVE ORDERS
        --------------------------------------
      */

      const activeOrders =
        orders.filter(
          order =>
            order.status !== "completed"
        ).length;


      /*
        --------------------------------------
        AVAILABLE SHOPPERS
        --------------------------------------
      */

      const availableShoppers =
        shoppers.filter(
          shopper =>
            shopper.available === true
        ).length;


      /*
        --------------------------------------
        TODAY'S ORDERS
        --------------------------------------
      */

      const today =
        new Date();

      today.setHours(
        0,
        0,
        0,
        0
      );


      const todayOrders =
        orders.filter(
          order =>
            new Date(
              order.created_at
            ) >= today
        ).length;


      /*
        --------------------------------------
        UPDATE DASHBOARD NUMBERS
        --------------------------------------
      */

      document.getElementById(
        "activeOrders"
      ).textContent =
        activeOrders;


      document.getElementById(
        "availableShoppers"
      ).textContent =
        availableShoppers;


      document.getElementById(
        "todayOrders"
      ).textContent =
        todayOrders;


      /*
        --------------------------------------
        NO ORDERS
        --------------------------------------
      */

      if (!orders.length) {

        ordersBox.innerHTML = `
          <div class="empty">

            <strong>
              No orders yet.
            </strong>

            <br><br>

            New Fetch requests
            will appear here.

          </div>
        `;

        return;
      }


      /*
        --------------------------------------
        DISPLAY ORDERS
        --------------------------------------
      */

      ordersBox.innerHTML =
        orders.map(
          (order, index) => {

            const items =
              String(
                order.items || ""
              )
                .split(",")
                .map(
                  item =>
                    item.trim()
                )
                .filter(Boolean);


            return `

              <div class="order">

                <div class="order-top">

                  <div class="order-id">
                    Order #${String(
                      index + 1
                    ).padStart(3, "0")}
                  </div>

                  <div class="status">
                    ${(order.status ||
                      "finding_shopper")
                      .replaceAll(
                        "_",
                        " "
                      )
                      .toUpperCase()}
                  </div>

                </div>


                <div class="order-grid">

                  <div>

                    <div class="label">
                      Store
                    </div>

                    <div class="store">
                      ${escapeHtml(
                        order.store_name
                      )}
                    </div>


                    <div class="label">
                      Shopping List
                    </div>


                    ${items.map(
                      item => `

                        <div class="item">

                          <span>
                            ${escapeHtml(
                              item
                            )}
                          </span>

                        </div>

                      `
                    ).join("")}


                    <div class="budget">

                      Budget:

                      ₹${Number(
                        order.budget || 0
                      ).toLocaleString(
                        "en-IN"
                      )}

                    </div>

                  </div>


                  <div>

                    <div class="label">
                      Order Status
                    </div>

                    <div class="status-text">
                      ${getStatusMessage(
                        order.status
                      )}
                    </div>

                  </div>

                </div>

              </div>

            `;

          }
        ).join("");


    } catch (error) {

      /*
        --------------------------------------
        SHOW REAL ERROR
        --------------------------------------
      */

      console.error(
        "FETCH ERROR:",
        error
      );


      errorBox.innerHTML = `

        <strong>
          Fetch could not load the database.
        </strong>

        <br><br>

        <strong>
          Error:
        </strong>

        ${escapeHtml(
          error.message ||
          String(error)
        )}

      `;


      ordersBox.innerHTML = "";

    }

  }


  /*
    ==========================================
    ORDER STATUS MESSAGES
    ==========================================
  */

  function getStatusMessage(status) {

    switch (status) {

      case "finding_shopper":

        return
          "Finding an available shopper...";


      case "shopper_assigned":

        return
          "Shopper assigned.";


      case "shopping":

        return
          "Shopper is shopping.";


      case "delivering":

        return
          "Order is being delivered.";


      case "completed":

        return
          "Order completed.";


      default:

        return
          status ||
          "Processing order...";

    }

  }


  /*
    ==========================================
    SECURITY — ESCAPE DATABASE CONTENT
    ==========================================
  */

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /*
    ==========================================
    START FETCH
    ==========================================
  */

  loadData();

</script>

</body>
</html>
